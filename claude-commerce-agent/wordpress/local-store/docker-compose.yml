# A disposable WordPress + WooCommerce site for running the two examples against.
# Copyright 2026 Automattic Inc. SPDX-License-Identifier: Apache-2.0
name: ${COMPOSE_PROJECT_NAME:-claude-commerce-local}

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${WORDPRESS_DB_NAME:-wordpress}
      MARIADB_USER: ${WORDPRESS_DB_USER:-wordpress}
      MARIADB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wordpress}
      MARIADB_ROOT_PASSWORD: ${WORDPRESS_DB_ROOT_PASSWORD:-wordpress-root}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u$${MARIADB_USER} -p$${MARIADB_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  wordpress:
    image: wordpress:${WORDPRESS_IMAGE_TAG:-php8.3-apache}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WORDPRESS_PORT:-8090}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wordpress}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('WP_DEBUG', true);
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);

        /*
         * The merchant example authenticates with a REST API key as HTTP Basic auth,
         * which WooCommerce accepts only over HTTPS. This local-only override marks the
         * merchant surfaces (wc/v3, wc-analytics) as SSL so a plain-http Docker site
         * accepts the same credential a real store would over HTTPS. The Store API and
         * the front end are left alone, so the URLs they render stay http://.
         */
        if (preg_match('#^/wp-json/(wc/v3|wc-analytics|wc-admin)/#', $$_SERVER['REQUEST_URI'] ?? '')) {
            $$_SERVER['HTTPS'] = 'on';
        }
    volumes:
      - wordpress_data:/var/www/html
      - ../claude-commerce-bridge:/var/www/html/wp-content/plugins/claude-commerce-bridge:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/wp-admin/install.php >/dev/null || curl -fsS http://localhost/wp-json >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  wpcli:
    image: wordpress:${WPCLI_IMAGE_TAG:-cli-php8.3}
    depends_on:
      wordpress:
        condition: service_healthy
    working_dir: /var/www/html
    user: "0:0"
    entrypoint: ["wp", "--allow-root"]
    command: ["--info"]
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wordpress}
      WORDPRESS_ADMIN_USER: ${WORDPRESS_ADMIN_USER:-store_admin}
    volumes:
      - wordpress_data:/var/www/html
      - ../claude-commerce-bridge:/var/www/html/wp-content/plugins/claude-commerce-bridge:ro
      - ./scripts:/workspace/scripts:ro

volumes:
  db_data:
  wordpress_data:
